---
title: Disable Sync Provider Notifications
description: Disables notifications within FIle Explorer from oneDrive or other sync providers to avoid adverisements
actions:
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
    value: 'ShowSyncProviderNotifications'
    data: '0'
    type: REG_DWORD